<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff6f91" />
  <title>Happy Birthday Brother!</title>
  <style>
    :root {
      --pink: #ff6f91;
      --purple: #8b5cf6;
      --ink: #30233d;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 15%, #ffe4ef 0, transparent 30%),
        radial-gradient(circle at 90% 85%, #e6ddff 0, transparent 34%),
        linear-gradient(135deg, #fff7fb, #f7f3ff);
    }
    .card {
      position: relative;
      isolation: isolate;
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 54px) clamp(20px, 6vw, 48px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 28px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 24px 70px rgba(91, 50, 120, .16);
      backdrop-filter: blur(12px);
      animation: rise .8s ease-out both;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #a04b87;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .cake { font-size: clamp(3.5rem, 13vw, 5.5rem); line-height: 1.15; filter: drop-shadow(0 8px 10px #ffb4cb66); }
    h1 {
      margin: 16px 0 12px;
      font-size: clamp(2.25rem, 9vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -.055em;
      background: linear-gradient(100deg, #ff5684, #9b5de5 60%, #5a78e8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .name { color: #7c3aed; }
    .message {
      max-width: 440px;
      margin: 0 auto;
      color: #6f6179;
      font-size: clamp(1rem, 3.7vw, 1.12rem);
      line-height: 1.75;
    }
    .wish {
      display: inline-block;
      margin: 26px 0 0;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(100deg, #ff6f91, #9b5de5);
      box-shadow: 0 10px 24px #d87aa64d;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .wish:hover { transform: translateY(-2px); box-shadow: 0 14px 28px #d87aa666; }
    .wish:active { transform: scale(.98); }
    .wish:focus-visible { outline: 3px solid #7c3aed; outline-offset: 4px; }
    .hint { margin: 16px 0 0; font-size: .82rem; color: #9a8ca3; }
    .sparkle { position: absolute; z-index: -1; opacity: .7; animation: float 4s ease-in-out infinite; pointer-events: none; }
    .s1 { top: 8%; left: 8%; font-size: 1.5rem; }
    .s2 { top: 16%; right: 8%; font-size: 1.8rem; animation-delay: -1.5s; }
    .s3 { bottom: 12%; left: 9%; font-size: 1.8rem; animation-delay: -2.2s; }
    .s4 { bottom: 10%; right: 10%; font-size: 1.4rem; animation-delay: -.8s; }
    canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(8deg); } }
    @media (max-width: 380px) {
      .card { border-radius: 22px; }
      .wish { width: 100%; padding: 14px 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="card">
    <span class="sparkle s1" aria-hidden="true">✨</span>
    <span class="sparkle s2" aria-hidden="true">💖</span>
    <span class="sparkle s3" aria-hidden="true">🌟</span>
    <span class="sparkle s4" aria-hidden="true">🎈</span>

    <p class="eyebrow">A little celebration just for you From Arsh Naqvi</p>
    <div class="cake" aria-hidden="true">🎂</div>
    <h1>Happy Birthday Brother <span id="nameHeading">!</span></h1>
    <p class="message" id="message">
      May your day be filled with big smiles, happy surprises, lots of love,
      and beautiful memories. Here's to a wonderful year ahead!
      💕remember me in your prayers
    </p>
    <button class="wish" id="celebrateBtn" type="button">🎉 Celebrate!</button>
    <p class="hint">Tap the button for a little birthday magic ✨</p>
  </main>

  <script>
    // Personalize the greeting with a URL such as: ?name=Alex
    const params = new URLSearchParams(window.location.search);
    const name = (params.get("name") || "").trim().slice(0, 40);
    if (name) {
      document.getElementById("nameHeading").textContent = ", " + name + "!";
      document.title = "Happy Birthday, " + name + "!";
    }

    // Lightweight confetti animation: no external libraries required.
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const colors = ["#ff6f91", "#ffd166", "#8b5cf6", "#06d6a0", "#5a78e8", "#ff9f1c"];
    let pieces = [];
    let animationId = null;
    let active = false;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas, { passive: true });
    resizeCanvas();

    function burst(count = 160) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      pieces = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: -20 - Math.random() * h * .35,
        size: 4 + Math.random() * 7,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - .5) * 4,
        vy: 2 + Math.random() * 4,
        rotation: Math.random() * Math.PI,
        spin: (Math.random() - .5) * .18,
        shape: Math.random() > .35 ? "rect" : "circle",
        wobble: Math.random() * Math.PI * 2
      }));
      active = true;
      if (animationId) cancelAnimationFrame(animationId);
      animate();
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      pieces.forEach(p => {
        p.x += p.vx + Math.sin(p.wobble) * .8;
        p.y += p.vy;
        p.rotation += p.spin;
        p.wobble += .06;
        p.vy += .018;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        if (p.shape === "rect") {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .65);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
      pieces = pieces.filter(p => p.y < window.innerHeight + 30);
      if (active && pieces.length) {
        animationId = requestAnimationFrame(animate);
      } else {
        active = false;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        animationId = null;
      }
    }

    document.getElementById("celebrateBtn").addEventListener("click", () => burst(190));
    // A small welcome burst on page load.
    window.addEventListener("load", () => setTimeout(() => burst(100), 350));
  </script>
</body>
</html>
